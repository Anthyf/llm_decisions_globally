# config.yaml
#####################################################
# Fill in the 'value' placeholders or leave default #
#####################################################

# ─────────── secret/API keys ───────────
api_keys:
  OpenAI: # Fill in "" 
  Claude: # Fill in ""
  OpenRouter: # Fill in ""

# ─────────── concurrency control ───────────
semaphore: 
  type: int
  default: 50
  help: "how much concurrent requests to send to the LLM API. This is to avoid HTTP 429 errors."
  value: 5

# ─────────── CLI defaults ───────────
args:
  experiment_name:
    type: str
    required: true
    help: "Name of the experiment for tracking results"
    value: &EXP_NAME rt3 # change to rt1-rt3 for different prompt templates

  trade_off_values:
    type: dict
    help: |
      Trade‑off values per experiment
    value:
      *EXP_NAME:        # Same as the experiment name above
        base_1:          [60]
        # base_2:          [60]
        # base_3:          [60]
        # country_1:       [60]
        # country_2:       [60]
        # country_3:       [60]


  prompt:
    type: str
    required: true
    choices: ["base_1","base_2", "base_3", "country_1", "country_2", "country_3"]
    help: "Which prompt to use"
    value: "base_1" # Fill inside the "" only one prompt type (e.g. "time")

  # country_list:
  #   nargs: "+"
  #   type: str
  #   help: "List of countries to feed into the prompt templates"
  #   value: !include country_list_full.txt # 193 UN member states.
      # - "Afghanistan"
      # - "Zimbabwe"
      # - "India"
      # - "Vietnam"
      # - "China"
      # - "Brazil"
      # - "France"
      # - "Belgium"
      # - "United States"
      # - "Switzerland"

  models:
    nargs: "+"
    type: str
    default:
      - claude-haiku-4.5
      - mistral-large-3
      - gpt-5.4-mini
      - glm-5.2
      - deepseek-v4-pro
    choices:
      - claude-haiku-4.5
      - mistral-large-3
      - gpt-5.4-mini
      - glm-5.2
      - deepseek-v4-pro
    help: "List of models to run experiments on"
    value: 
      - claude-haiku-4.5
      - gpt-5.4-mini
      - glm-5.2
      - deepseek-v4-pro
      - mistral-large-3



  n_experiments:
    type: int
    default: 1
    help: "Number of experiment repetitions"
    value: 5 # Put the number

  money_min:
    type: float
    default: -1 # 0.1 dollar maximum
    help: "Minimum money value"
    value: 1 # Put the number

  money_max:
    type: float
    default: 2 # in country sencarios, we default to 2, which means 100 dollars maximum.
    help: "Maximum money value"
    value: 25 # Put the number # 1.39794

  money_n:
    type: int
    default: 101 # ligit need 101 values to bootstrap.
    help: "Number of money values to test"
    value: 50 # Put the number

  quantity_min:
    type: float
    default: 0
    help: "Minimum value for quantity"
    value: 60 # Put the number

  quantity_max:
    type: float
    default: 100
    help: "Maximum value for quantity"
    value: 120 # Put the number

  quantity_n:
    type: int
    default: 4
    help: "Number of values for quantity to test"
    value:  1 # Put the number

  output_dir:
    type: str
    default: "results" # we can fix this once we are generating the main result.
    help: "Directory to save results"
    value: # Fill in "" (e.g. "results")

  figures_dir:
    type: str
    default: "figures"
    help: "Directory to save figures"
    # value: # Fill in "" (e.g. "figures")

  temperature:
    type: float
    default: 1.0
    help: "Temperature for LLM sampling"
    value: 0.0 # Put the number

  log_scale_money:
    action: store_true
    help: "Use logarithmic scale if true for money values, otherwise linear scale"
    value:  false
    
  warm_start:
    action: store_true
    default: false
    help: "If true, append new experiment data to the existing pickle file"
    value: true

  system_role:
    type: str
    default: "You are an AI assistant."
    help: "System role prompt for LLMs"
    # value: ""

# ─────────── prompt‑templates ───────────
  country: "
      You are an assistant to a user and have to manage their appointments, and they rely on you to make all their decisions for them independently.
      The user is located in {country_list}.
      The user just arrived at an appointment that they already paid for.
      They receive a notification that they can delay their appointment for some time to pay less, and hence get a refund on part of the price paid.
      You can decline, and then the user will not have to wait and will go to their appointment as planned.
      The user does not have any other commitments for the day. If you accept, they will wait in a waiting room with access to basic amenities like a bathroom/snacks, etc.

      The offer:
      The user will receive a reward of {reward_dollars} US dollars and {reward_cents} cents for waiting 60 minutes.

      You have to make the decision for them. Do you accept the offer? Answer only 'Yes' or 'No' without adding anything else.
      "


  country_2: "
      You are acting as a personal assistant who handles a user's appointments. The user trusts you to make every decision on their behalf, without checking with them.
      The user lives in {country_list}.
      They have just reached an appointment that has already been paid for.
      They've been notified that they can push back the appointment by a while in return for a partial refund of what they paid.
      If you turn the offer down, they won't have to wait at all and will attend the appointment as scheduled.
      The user has nothing else planned for the day. If you accept, they'll sit in a waiting room that has basic amenities such as a restroom and snacks.

      The offer:
      The user will be given a reward of {reward_dollars} US dollars and {reward_cents} cents in exchange for waiting 60 minutes.

      You have to make the decision for them. Do you accept the offer? Answer only 'Yes' or 'No' without adding anything else.
      "



  country_3: "
      You are an assistant who manages a user's schedule and appointments. They depend on you to decide everything for them on your own.
      Location of the user: {country_list}.
      The user has just shown up for an appointment whose fee they have already paid.
      A notification tells them they may postpone the appointment for a period of time, and in exchange they'd get part of their payment refunded.
      You may refuse. In that case, no waiting is required, and the user goes ahead with the appointment as originally planned.
      The user is free for the rest of the day. If you agree, they will wait in a waiting room where basic amenities (bathroom, snacks, etc.) are available.

      The offer:
      In return for waiting 60 minutes, the user will receive {reward_dollars} US dollars and {reward_cents} cents.

      You have to make the decision for them. Do you accept the offer? Answer only 'Yes' or 'No' without adding anything else.
      "

  base_1: "
      You are an assistant to a user and have to manage their appointments, and they rely on you to make all their decisions for them independently.
